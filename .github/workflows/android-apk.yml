name: Build Android APK

# Déclenché manuellement (Actions → Build Android APK → Run workflow)
# ou automatiquement sur chaque tag vX.Y.Z
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      # secrets.* est interdit dans les conditions if: (erreur "Unrecognized
      # named-value: 'secrets'") — on le convertit en variable d'env au
      # niveau du job, utilisable elle dans if: env.HAS_PLAY_KEYSTORE == 'true'
      HAS_PLAY_KEYSTORE: ${{ secrets.GROWMANAGER_KEYSTORE_BASE64 != '' }}

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      # Google Play (protection automatique Play) exige minSdk >= 24.
      # Le template Capacitor génère 23 : on le remonte après cap add.
      - name: Set minSdkVersion 24 (exigence Google Play)
        run: |
          sed -i -E 's/minSdkVersion = [0-9]+/minSdkVersion = 24/' android/variables.gradle
          grep -q 'minSdkVersion = 24' android/variables.gradle

      - name: Generate icons & splash screens
        run: npx @capacitor/assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      # ==========================================================
      # Numéro de version Android dérivé de package.json
      # 3.5.3 → versionName "3.5.3", versionCode 30503
      # Android exige un versionCode croissant pour accepter une
      # mise à jour (APK) ou un nouvel upload (Play Console).
      # ==========================================================
      - name: Set Android version from package.json
        run: |
          python3 - <<'PY'
          import json, re
          version = json.load(open("package.json"))["version"]
          major, minor, patch = (int(x) for x in version.split(".")[:3])
          code = major * 10000 + minor * 100 + patch
          path = "android/app/build.gradle"
          content = open(path).read()
          content, n1 = re.subn(r"versionCode\s+\d+", f"versionCode {code}", content, count=1)
          content, n2 = re.subn(r'versionName\s+"[^"]*"', f'versionName "{version}"', content, count=1)
          assert n1 == 1 and n2 == 1, "versionCode/versionName introuvables dans build.gradle"
          open(path, "w").write(content)
          print(f"versionName={version} versionCode={code}")
          PY

      # ==========================================================
      # Signature avec la clé fixe GrowManager (keystore en secret)
      # Même clé à chaque build → l'APK s'installe PAR-DESSUS la
      # version précédente (données conservées), et sert aussi
      # d'upload key pour Google Play (AAB).
      # Sans secret : repli sur l'APK debug (clé aléatoire à chaque
      # build → désinstallation obligatoire entre deux versions).
      # Voir wiki/features/mobile-app.md.
      # ==========================================================

      - name: Decode keystore
        if: env.HAS_PLAY_KEYSTORE == 'true'
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/growmanager-upload.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.GROWMANAGER_KEYSTORE_BASE64 }}

      - name: Configure Gradle signing
        if: env.HAS_PLAY_KEYSTORE == 'true'
        run: |
          python3 - <<'PY'
          import re
          path = "android/app/build.gradle"
          content = open(path).read()

          signing_block = (
              "    signingConfigs {\n"
              "        release {\n"
              "            storeFile file(\"growmanager-upload.keystore\")\n"
              "            storePassword System.getenv(\"GROWMANAGER_KEYSTORE_PASSWORD\")\n"
              "            keyAlias System.getenv(\"GROWMANAGER_KEY_ALIAS\")\n"
              "            keyPassword System.getenv(\"GROWMANAGER_KEY_PASSWORD\")\n"
              "        }\n"
              "    }\n\n"
          )
          assert content.count("    buildTypes {") == 1, "bloc buildTypes introuvable"
          content = content.replace("    buildTypes {", signing_block + "    buildTypes {", 1)
          content, n = re.subn(
              r"(buildTypes \{\s*release \{\n)",
              r"\1            signingConfig signingConfigs.release\n",
              content, count=1,
          )
          assert n == 1, "bloc release introuvable"
          open(path, "w").write(content)
          PY

      - name: Build signed release APK + AAB
        if: env.HAS_PLAY_KEYSTORE == 'true'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease
        env:
          GROWMANAGER_KEYSTORE_PASSWORD: ${{ secrets.GROWMANAGER_KEYSTORE_PASSWORD }}
          GROWMANAGER_KEY_ALIAS: ${{ secrets.GROWMANAGER_KEY_ALIAS }}
          GROWMANAGER_KEY_PASSWORD: ${{ secrets.GROWMANAGER_KEY_PASSWORD }}

      - name: Build debug APK (repli sans keystore)
        if: env.HAS_PLAY_KEYSTORE != 'true'
        run: |
          echo "::warning::Secret GROWMANAGER_KEYSTORE_BASE64 absent : APK debug, désinstallation nécessaire entre deux versions."
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$HAS_PLAY_KEYSTORE" = "true" ]; then
            SRC=android/app/build/outputs/apk/release/app-release.apk
          else
            SRC=android/app/build/outputs/apk/debug/app-debug.apk
          fi
          cp "$SRC" "growmanager-v${VERSION}.apk"
          echo "APK_NAME=growmanager-v${VERSION}.apk" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: growmanager-apk
          path: frontend/${{ env.APK_NAME }}
          retention-days: 30

      - name: Attach APK to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/${{ env.APK_NAME }}

      - name: Rename AAB
        if: env.HAS_PLAY_KEYSTORE == 'true'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/bundle/release/app-release.aab "growmanager-v${VERSION}.aab"
          echo "AAB_NAME=growmanager-v${VERSION}.aab" >> "$GITHUB_ENV"

      - name: Upload AAB artifact
        if: env.HAS_PLAY_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: growmanager-aab
          path: frontend/${{ env.AAB_NAME }}
          retention-days: 30

      - name: Attach AAB to release (tags only)
        if: env.HAS_PLAY_KEYSTORE == 'true' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/${{ env.AAB_NAME }}
